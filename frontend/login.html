<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập - Hệ thống Quản lý Nội bộ MOYN</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1f2430">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm">
      <h1>Hệ thống Quản lý Nội bộ MOYN</h1>
      <p class="sub">Đăng nhập để tiếp tục</p>
      <div class="login-error" id="loginError"></div>
      <input type="text" id="username" placeholder="Tên đăng nhập" autocomplete="username" autofocus required>
      <input type="password" id="password" placeholder="Mật khẩu" autocomplete="current-password" required>
      <button type="submit">Đăng nhập</button>
    </form>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});</script>
</body>
</html>
